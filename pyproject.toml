[project]
name = "terratriage"
version = "0.1.0"
description = "Production-shaped multimodal disaster damage assessment pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "langgraph>=0.0.40",
    "langchain-core>=0.1.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "torch>=2.2.0",
    "transformers>=4.38.0",
    "accelerate>=0.27.0",
    "llama-index>=0.10.0",
    "llama-index-vector-stores-postgres>=0.2.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "pgvector>=0.2.0",
    "httpx>=0.26.0",
    "tenacity>=8.2.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "opencv-python>=4.9.0",
    "supervision>=0.18.0",
    "ragas>=0.1.0",
    "langfuse>=2.0.0",
    "prometheus-client>=0.19.0",
    "structlog>=24.1.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]
gpu = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
]
api = [
    "gunicorn>=21.0.0",
]
worker = [
    "celery>=5.3.0",
    "redis>=5.0.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "T20"]
ignore = ["E501", "B008"]
src = ["terratriage", "apps", "tests", "scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict_equality = true
no_implicit_reexport = true
check_untyped_defs = true
allow_untyped_globals = false
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[project.scripts]
terratriage = "terratriage.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["terratriage*", "apps*", "tests*", "scripts*"]